name: android

on:
  push:
    branches: [ main ]
    paths: [ 'android-app/**', '.github/workflows/android.yml' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9 (без wrapper-jar)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK (debug-подпись для установки)
        working-directory: android-app
        run: gradle :app:assembleRelease -PciSigning --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneMic-android
          path: android-app/app/build/outputs/apk/release/*.apk
