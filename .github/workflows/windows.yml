name: windows

on:
  push:
    branches: [ main ]
    paths: [ 'windows-app/**', 'driver/**', 'global.json', '.github/workflows/windows.yml' ]
  pull_request:
  workflow_dispatch:

jobs:
  app:
    # Пин образа: windows-latest мигрировал на windows-2025 (VS 18) — дрейф окружения
    # на время отладки сборки исключаем. windows-2022 = VS 2022 + .NET SDK 8.0.424.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ВАЖНО: global.json в корне репозитория пинует SDK на 8.0.4xx.
      # Без него `dotnet publish` берёт САМЫЙ НОВЫЙ предустановленный SDK
      # (на windows-2022 это 9.0.317/10.0.400), где MSBuild 17.12+ не может
      # инстанцировать XamlCompiler: fallback в out-of-proc taskhost →
      # MSB4061 "Type must be a type provided by the runtime" +
      # MSB4027 "MetadataLoadContext ... has been disposed" — известная
      # регрессия новых MSBuild. На MSBuild 17.11 (.NET 8 SDK) in-proc
      # загрузка net6.0-задачи работает штатно.
      - name: Show resolved SDK
        shell: pwsh
        run: dotnet --version

      - name: Test Core
        run: dotnet test windows-app/tests/PhoneMic.Core.Tests/PhoneMic.Core.Tests.csproj -c Release

      - name: Restore App
        run: dotnet restore windows-app/src/PhoneMic.App/PhoneMic.App.csproj

      # Microsoft.UI.Xaml.Markup.Compiler.dll (tools/net6.0 в пакете WASDK) ссылается
      # на System.Security.Permissions 6.0.0, которой в пакете НЕТ — in-proc загрузка
      # задачи CompileXaml падает с MSB4062 (упаковочный баг WASDK). Подкладываем DLL
      # рядом с задачей: источник — глобальный кэш NuGet (гарантирован PackageReference
      # в csproj), фолбэк — nupkg с api.nuget.org.
      - name: Patch WASDK XamlCompiler dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wasdkRoot = "$env:USERPROFILE\.nuget\packages\microsoft.windowsappsdk"
          $ver = (Get-ChildItem $wasdkRoot -Directory |
                  Sort-Object -Property { [version]$_.Name } -Descending |
                  Select-Object -First 1).Name
          $dst = Join-Path $wasdkRoot "$ver\tools\net6.0"
          if (-not (Test-Path $dst)) { throw "WASDK tools folder not found: $dst" }
          $dll = "System.Security.Permissions.dll"
          if (Test-Path (Join-Path $dst $dll)) { Write-Host "Already patched"; exit 0 }
          $src = "$env:USERPROFILE\.nuget\packages\system.security.permissions\6.0.0\lib\net6.0\$dll"
          if (-not (Test-Path $src)) {
            Write-Host "Not in cache — downloading nupkg from nuget.org"
            $zip = Join-Path $env:RUNNER_TEMP "ssp.zip"
            Invoke-WebRequest -Uri 'https://api.nuget.org/v3-flatcontainer/system.security.permissions/6.0.0/system.security.permissions.6.0.0.nupkg' -OutFile $zip
            $ext = Join-Path $env:RUNNER_TEMP "ssp"
            Expand-Archive -Path $zip -DestinationPath $ext -Force
            $src = Join-Path $ext "lib\net6.0\$dll"
          }
          Copy-Item $src $dst -Force
          $copied = Get-Item (Join-Path $dst $dll)
          Write-Host "Patched: $($copied.FullName) ($($copied.Length) bytes)"

      # UseXamlCompilerExecutable=false: XAML-компилятор запускается in-proc (net6.0),
      # а не как отдельный процесс. В exe-режиме при ошибке он молча выходит с кодом 1
      # (MSB3073 без текста), т.к. Exec гасит OutputDeserializer; in-proc печатает
      # реальные WMC-ошибки прямо в лог MSBuild.
      - name: Publish WinUI 3 (unpackaged, self-contained)
        run: >
          dotnet publish windows-app/src/PhoneMic.App/PhoneMic.App.csproj
          -c Release -r win-x64 --self-contained
          -p:Platform=x64 -p:WindowsAppSDKSelfContained=true
          -p:UseXamlCompilerExecutable=false

      # На случай отката на exe-режим: дампим ввод/вывод компилятора.
      - name: Dump XAML compiler diagnostics
        if: failure()
        shell: pwsh
        run: |
          $found = Get-ChildItem windows-app/src/PhoneMic.App/obj -Recurse -Include output.json,input.json -ErrorAction SilentlyContinue
          if (-not $found) {
            Write-Host "NO input.json/output.json found (in-proc mode does not write them; WMC errors are printed above in the log)"
          }
          foreach ($f in $found) {
            Write-Host "=== $($f.FullName) ==="
            Get-Content $f.FullName -Raw -ErrorAction SilentlyContinue
          }

      - name: Zip app
        shell: pwsh
        run: |
          $src = "windows-app/src/PhoneMic.App/bin/Release/net8.0-windows10.0.22621.0/win-x64/publish"
          Compress-Archive -Path "$src/*" -DestinationPath artifacts/PhoneMic-win-x64.zip -Force

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: PhoneMic-windows-app
          path: artifacts/PhoneMic-win-x64.zip

  driver:
    # Пин образа: windows-latest мигрировал на windows-2025 (VS 18) — дрейф окружения
    # на время отладки сборки исключаем. windows-2022 = VS 2022 — проверенно.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # WDK УЖЕ ПРЕДУСТАНОВЛЕН на образе windows-2022 (см. runner-images Windows2022-Readme.md):
      #   Windows Driver Kit 10.1.26100.4202 + WDK VSIX 10.0.26100.16 (даёт тулсет
      #   WindowsKernelModeDriver10.0) + Windows SDK 10.1.26100.7705.
      # Скачивать ничего не нужно: все известные ссылки-установщики мертвы —
      #   aka.ms/winsdk|wdk/10.0.22621.755 → 302 на bing.com (HTML вместо exe, отсюда
      #   "corrupted and unreadable"), fwlink 2205489/2205490/2259814 → 302 на
      #   рекламно-политические страницы. Просто детектируем предустановленный WDK
      #   и передаём его версию в msbuild (vcxproj использует WindowsTargetPlatformVersion).
      - name: Detect preinstalled WDK (km headers)
        shell: pwsh
        run: |
          $inc = "${env:ProgramFiles(x86)}\Windows Kits\10\Include"
          $kits = Get-ChildItem $inc -Directory -ErrorAction SilentlyContinue |
                  Where-Object { $_.Name -like '10.*' -and (Test-Path (Join-Path $_.FullName 'km\ntddk.h')) } |
                  Sort-Object { [version]$_.Name } -Descending
          if (-not $kits) {
            Write-Host "Include folders found under $inc :"
            Get-ChildItem $inc -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)" }
            throw "No WDK km headers found under $inc — expected preinstalled WDK on windows-2022 runner"
          }
          $kit = $kits[0]
          Write-Host "Using Windows SDK/WDK: $($kit.Name)"
          Add-Content -Path $env:GITHUB_ENV -Value "WTPV=$($kit.Name)"

      - name: Build driver (MSBuild)
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          Write-Host "WindowsTargetPlatformVersion = $env:WTPV"
          # SkipPackageVerification: DPVerifierTask грузит x86\InfVerif.dll, которого
          # нет в предустановленном на раннере WDK (обрезан образ) — проверку INF
          # пропускаем (inf2cat .cat продолжает строиться).
          & $msbuild driver/phonemic.vcxproj /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=$env:WTPV /p:SkipPackageVerification=true /t:Build

      - name: Package driver (sys/inf/cat)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $out = "driver/x64/Release/phonemic"
          if (Test-Path $out) {
            Copy-Item "$out/phonemic.sys","$out/phonemic.inf","$out/phonemic.cat" artifacts -Force -ErrorAction SilentlyContinue
            Copy-Item scripts/install_driver.ps1 artifacts -Force
            Copy-Item scripts/uninstall_driver.ps1 artifacts -Force
            Compress-Archive -Path "artifacts/*" -DestinationPath artifacts/PhoneMic-driver.zip -Force
          } else {
            Write-Host "Драйвер не собран в CI — соберите локально по docs/DRIVER_BUILD.md"
          }

      - name: Upload driver
        uses: actions/upload-artifact@v4
        with:
          name: PhoneMic-windows-driver
          path: artifacts/PhoneMic-driver.zip
          if-no-files-found: ignore
