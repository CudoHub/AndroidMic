name: windows

on:
  push:
    branches: [ main ]
    paths: [ 'windows-app/**', 'driver/**', 'global.json', '.github/workflows/windows.yml' ]
  pull_request:
  workflow_dispatch:

jobs:
  app:
    # Пин образа: windows-latest мигрировал на windows-2025 (VS 18) — дрейф окружения
    # на время отладки сборки исключаем. windows-2022 = VS 2022 + .NET SDK 8.0.424.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # global.json пинует SDK на 8.0.4xx — нужен для dotnet test (Core) и для
      # резолва SDK-style проекта под msbuild.exe (см. шаг Publish).
      - name: Show resolved SDK
        shell: pwsh
        run: dotnet --version

      - name: Test Core
        run: dotnet test windows-app/tests/PhoneMic.Core.Tests/PhoneMic.Core.Tests.csproj -c Release

      # Publish через Full-Framework MSBuild (msbuild.exe из VS), а НЕ dotnet CLI.
      #
      # Причина — XAML-компилятор WASDK 1.6 в in-proc варианте существует в двух
      # видах:
      #   * tools/net472 — Full CLR, самодостаточная папка (это путь VS);
      #   * tools/net6.0 — только для dotnet CLI (interop.targets ставит
      #     UseXamlCompilerExecutable=true на Core), НО эта сборка сломана на
      #     CoreCLR: она зовёт RuntimeEnvironment.GetRuntimeInterfaceAsObject
      #     (CLR COM IMetaDataDispenser для чтения winmd), который на .NET
      #     Core/5+ всегда бросает PlatformNotSupportedException → WMC9999
      #     "Operation is not supported on this platform" (доказано локально на
      #     Linux и подтверждено CI-прогоном 5; прогоны 1-3 упирались ещё и в
      #     молчаливый exit 1 exe-режима, а interop.targets прямо запрещает
      #     exe-режим вне Core).
      #   Полноценный путь — Full-MSBuild: in-proc net472-задача (дефолт при
      #   MSBuildRuntimeType=Full, свойство НЕ переопределяем), все зависимости
      #   компилятора лежат в tools/net472 пакета, патчи не нужны.
      - name: Publish WinUI 3 (unpackaged, self-contained, Full-MSBuild)
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild.exe not found via vswhere" }
          Write-Host "MSBuild: $msbuild"
          & $msbuild windows-app/src/PhoneMic.App/PhoneMic.App.csproj `
            -restore -t:Publish `
            -p:Configuration=Release `
            -p:Platform=x64 `
            -p:RuntimeIdentifier=win-x64 `
            -p:SelfContained=true `
            -p:WindowsAppSDKSelfContained=true `
            -nologo -v:m `
            -bl:"$env:GITHUB_WORKSPACE\app-publish.binlog"

      # Полный двоичный лог при падении — если сборка снова упадёт, в артефакте
      # будет точная картина (какая задача/таргет и почему).
      - name: Upload publish binlog (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-publish-binlog
          path: app-publish.binlog
          if-no-files-found: ignore

      # На случай отката на exe-режим: дампим ввод/вывод компилятора.
      - name: Dump XAML compiler diagnostics
        if: failure()
        shell: pwsh
        run: |
          $found = Get-ChildItem windows-app/src/PhoneMic.App/obj -Recurse -Include output.json,input.json -ErrorAction SilentlyContinue
          if (-not $found) {
            Write-Host "NO input.json/output.json found (in-proc mode does not write them; WMC errors are printed above in the log)"
          }
          foreach ($f in $found) {
            Write-Host "=== $($f.FullName) ==="
            Get-Content $f.FullName -Raw -ErrorAction SilentlyContinue
          }

      - name: Zip app
        shell: pwsh
        run: |
          # Путь publish зависит от Platform/RID — ищем фактическую папку с
          # PhoneMic.App.exe вместо хардкода (bin/x64/Release/net8.0-windows10.0.22621.0/win-x64/publish).
          $pub = Get-ChildItem windows-app/src/PhoneMic.App/bin -Recurse -Directory -Filter publish -ErrorAction SilentlyContinue |
                  Where-Object { Test-Path (Join-Path $_.FullName 'PhoneMic.App.exe') } |
                  Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $pub) { throw "Publish output with PhoneMic.App.exe not found under windows-app/src/PhoneMic.App/bin" }
          Write-Host "Publish dir: $($pub.FullName)"
          Compress-Archive -Path "$($pub.FullName)/*" -DestinationPath artifacts/PhoneMic-win-x64.zip -Force

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: PhoneMic-windows-app
          path: artifacts/PhoneMic-win-x64.zip

  driver:
    # Пин образа: windows-latest мигрировал на windows-2025 (VS 18) — дрейф окружения
    # на время отладки сборки исключаем. windows-2022 = VS 2022 — проверенно.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # WDK УЖЕ ПРЕДУСТАНОВЛЕН на образе windows-2022 (см. runner-images Windows2022-Readme.md):
      #   Windows Driver Kit 10.1.26100.4202 + WDK VSIX 10.0.26100.16 (даёт тулсет
      #   WindowsKernelModeDriver10.0) + Windows SDK 10.1.26100.7705.
      # Скачивать ничего не нужно: все известные ссылки-установщики мертвы —
      #   aka.ms/winsdk|wdk/10.0.22621.755 → 302 на bing.com (HTML вместо exe, отсюда
      #   "corrupted and unreadable"), fwlink 2205489/2205490/2259814 → 302 на
      #   рекламно-политические страницы. Просто детектируем предустановленный WDK
      #   и передаём его версию в msbuild (vcxproj использует WindowsTargetPlatformVersion).
      - name: Detect preinstalled WDK (km headers)
        shell: pwsh
        run: |
          $inc = "${env:ProgramFiles(x86)}\Windows Kits\10\Include"
          $kits = Get-ChildItem $inc -Directory -ErrorAction SilentlyContinue |
                  Where-Object { $_.Name -like '10.*' -and (Test-Path (Join-Path $_.FullName 'km\ntddk.h')) } |
                  Sort-Object { [version]$_.Name } -Descending
          if (-not $kits) {
            Write-Host "Include folders found under $inc :"
            Get-ChildItem $inc -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)" }
            throw "No WDK km headers found under $inc — expected preinstalled WDK on windows-2022 runner"
          }
          $kit = $kits[0]
          Write-Host "Using Windows SDK/WDK: $($kit.Name)"
          Add-Content -Path $env:GITHUB_ENV -Value "WTPV=$($kit.Name)"

      - name: Build driver (MSBuild)
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          Write-Host "WindowsTargetPlatformVersion = $env:WTPV"
          # SkipPackageVerification: DPVerifierTask грузит x86\InfVerif.dll, которого
          # нет в предустановленном на раннере WDK (обрезан образ) — проверку INF
          # пропускаем (inf2cat .cat продолжает строиться).
          & $msbuild driver/phonemic.vcxproj /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=$env:WTPV /p:SkipPackageVerification=true /t:Build

      - name: Package driver (sys/inf/cat)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $out = "driver/x64/Release/phonemic"
          if (Test-Path $out) {
            Copy-Item "$out/phonemic.sys","$out/phonemic.inf","$out/phonemic.cat" artifacts -Force -ErrorAction SilentlyContinue
            Copy-Item scripts/install_driver.ps1 artifacts -Force
            Copy-Item scripts/uninstall_driver.ps1 artifacts -Force
            Compress-Archive -Path "artifacts/*" -DestinationPath artifacts/PhoneMic-driver.zip -Force
          } else {
            Write-Host "Драйвер не собран в CI — соберите локально по docs/DRIVER_BUILD.md"
          }

      - name: Upload driver
        uses: actions/upload-artifact@v4
        with:
          name: PhoneMic-windows-driver
          path: artifacts/PhoneMic-driver.zip
          if-no-files-found: ignore
