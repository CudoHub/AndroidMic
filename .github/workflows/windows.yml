name: windows

on:
  push:
    branches: [ main ]
    paths: [ 'windows-app/**', 'driver/**', '.github/workflows/windows.yml' ]
  pull_request:
  workflow_dispatch:

jobs:
  app:
    # Фиксируем образ: windows-latest мигрировал на windows-2025 (VS 18).
    # Пин на windows-2022 исключает дрейф окружения на время отладки сборки.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test Core
        run: dotnet test windows-app/tests/PhoneMic.Core.Tests/PhoneMic.Core.Tests.csproj -c Release

      - name: Publish WinUI 3 (unpackaged, self-contained)
        run: >
          dotnet publish windows-app/src/PhoneMic.App/PhoneMic.App.csproj
          -c Release -r win-x64 --self-contained
          -p:Platform=x64 -p:WindowsAppSDKSelfContained=true

      # XamlCompiler.exe при ошибке pass1 молча выходит с кодом 1 (MSB3073 без
      # текста): детали он пишет в output.json, который MSBuild не показывает.
      # Дампим ввод/вывод компилятора, чтобы реальные WMC-ошибки были видны в логе.
      - name: Dump XAML compiler diagnostics
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem windows-app/src/PhoneMic.App/obj -Recurse -Filter output.json -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "=== $($_.FullName) ==="
            Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue
          }
          Get-ChildItem windows-app/src/PhoneMic.App/obj -Recurse -Filter input.json -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "=== $($_.FullName) ==="
            $json = Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json
            Write-Host ("ProjectName: " + $json.ProjectName)
            Write-Host ("XamlFiles: " + ($json.XamlFiles -join ', '))
          }

      - name: Zip app
        shell: pwsh
        run: |
          $src = "windows-app/src/PhoneMic.App/bin/Release/net8.0-windows10.0.22621.0/win-x64/publish"
          Compress-Archive -Path "$src/*" -DestinationPath artifacts/PhoneMic-win-x64.zip -Force

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: PhoneMic-windows-app
          path: artifacts/PhoneMic-win-x64.zip

  driver:
    # Фиксируем образ: windows-latest мигрировал на windows-2025 (VS 18), где
    # winget-установка WDK 22621 не даёт рабочих km-хедеров (ntddk.h not found).
    # windows-2022 = VS 2022: связка WDK 22621 + VSIX-интеграция проверенно работает.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install WDK (winget)
        shell: pwsh
        run: |
          winget install --id Microsoft.WindowsWDK.10.0.22621 --silent --accept-package-agreements --accept-source-agreements

      # Без continue-on-error: если winget тихо провалился, падаем сразу
      # с внятным сообщением, а не с непонятным "ntddk.h: No such file".
      - name: Verify WDK
        shell: pwsh
        run: |
          $ntddk = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.22621.0\km\ntddk.h"
          if (-not (Test-Path $ntddk)) {
            throw "WDK 10.0.22621.0 not found (missing: $ntddk). winget WDK install failed."
          }
          Write-Host "WDK 10.0.22621.0 OK"

      - name: Build driver (MSBuild)
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          & $msbuild driver/phonemic.vcxproj /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0.22621.0 /t:Build

      - name: Package driver (sys/inf/cat)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $out = "driver/x64/Release/phonemic"
          if (Test-Path $out) {
            Copy-Item "$out/phonemic.sys","$out/phonemic.inf","$out/phonemic.cat" artifacts -Force -ErrorAction SilentlyContinue
            Copy-Item scripts/install_driver.ps1 artifacts -Force
            Copy-Item scripts/uninstall_driver.ps1 artifacts -Force
            Compress-Archive -Path "artifacts/*" -DestinationPath artifacts/PhoneMic-driver.zip -Force
          } else {
            Write-Host "Драйвер не собран в CI — соберите локально по docs/DRIVER_BUILD.md"
          }

      - name: Upload driver
        uses: actions/upload-artifact@v4
        with:
          name: PhoneMic-windows-driver
          path: artifacts/PhoneMic-driver.zip
          if-no-files-found: ignore
