name: windows

on:
  push:
    branches: [ main ]
    paths: [ 'windows-app/**', 'driver/**', '.github/workflows/windows.yml' ]
  pull_request:
  workflow_dispatch:

jobs:
  app:
    # Фиксируем образ: windows-latest мигрировал на windows-2025 (VS 18).
    # Пин на windows-2022 исключает дрейф окружения на время отладки сборки.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test Core
        run: dotnet test windows-app/tests/PhoneMic.Core.Tests/PhoneMic.Core.Tests.csproj -c Release

      # UseXamlCompilerExecutable=false: XAML-компилятор запускается in-proc (net6.0),
      # а не как net472-процесс. В exe-режиме при ошибке он молча выходит с кодом 1
      # (MSB3073 без текста), т.к. Exec гасит OutputDeserializer; in-proc печатает
      # реальные WMC-ошибки прямо в лог MSBuild.
      - name: Publish WinUI 3 (unpackaged, self-contained)
        run: >
          dotnet publish windows-app/src/PhoneMic.App/PhoneMic.App.csproj
          -c Release -r win-x64 --self-contained
          -p:Platform=x64 -p:WindowsAppSDKSelfContained=true
          -p:UseXamlCompilerExecutable=false

      # На случай отката на exe-режим: дампим ввод/вывод компилятора.
      - name: Dump XAML compiler diagnostics
        if: failure()
        shell: pwsh
        run: |
          $found = Get-ChildItem windows-app/src/PhoneMic.App/obj -Recurse -Include output.json,input.json -ErrorAction SilentlyContinue
          if (-not $found) {
            Write-Host "NO input.json/output.json found (in-proc mode does not write them; WMC errors are printed above in the log)"
          }
          foreach ($f in $found) {
            Write-Host "=== $($f.FullName) ==="
            Get-Content $f.FullName -Raw -ErrorAction SilentlyContinue
          }

      - name: Zip app
        shell: pwsh
        run: |
          $src = "windows-app/src/PhoneMic.App/bin/Release/net8.0-windows10.0.22621.0/win-x64/publish"
          Compress-Archive -Path "$src/*" -DestinationPath artifacts/PhoneMic-win-x64.zip -Force

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: PhoneMic-windows-app
          path: artifacts/PhoneMic-win-x64.zip

  driver:
    # Фиксируем образ: windows-latest мигрировал на windows-2025 (VS 18), где
    # связка WDK 22621 + VS-интеграция сломана. windows-2022 = VS 2022 — проверенно.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # winget на GitHub-раннерах отсутствует как класс — ставим тихо через
      # официальные bootstrappers с aka.ms (ссылки проверены, HTTP 200).
      - name: Install Windows SDK 10.0.22621.755
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri 'https://aka.ms/winsdk/10.0.22621.755/winsdksetup.exe' -OutFile "$env:RUNNER_TEMP\winsdksetup.exe"
          $p = Start-Process -Wait -PassThru -FilePath "$env:RUNNER_TEMP\winsdksetup.exe" -ArgumentList '/q','/norestart'
          Write-Host "SDK setup exit: $($p.ExitCode)"
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "Windows SDK silent install failed (exit $($p.ExitCode))" }

      - name: Install WDK 10.0.22621.755
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri 'https://aka.ms/wdk/10.0.22621.755/wdksetup.exe' -OutFile "$env:RUNNER_TEMP\wdksetup.exe"
          $p = Start-Process -Wait -PassThru -FilePath "$env:RUNNER_TEMP\wdksetup.exe" -ArgumentList '/q','/norestart'
          Write-Host "WDK setup exit: $($p.ExitCode)"
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "WDK silent install failed (exit $($p.ExitCode))" }

      # Громкая проверка: без km-хедеров падаем сразу с внятным сообщением,
      # а не с непонятным "ntddk.h: No such file".
      - name: Verify WDK
        shell: pwsh
        run: |
          $ntddk = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.22621.0\km\ntddk.h"
          if (-not (Test-Path $ntddk)) { throw "WDK 10.0.22621.0 km headers missing ($ntddk)" }
          Write-Host "WDK 10.0.22621.0 OK"

      - name: Build driver (MSBuild)
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          & $msbuild driver/phonemic.vcxproj /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0.22621.0 /t:Build

      - name: Package driver (sys/inf/cat)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $out = "driver/x64/Release/phonemic"
          if (Test-Path $out) {
            Copy-Item "$out/phonemic.sys","$out/phonemic.inf","$out/phonemic.cat" artifacts -Force -ErrorAction SilentlyContinue
            Copy-Item scripts/install_driver.ps1 artifacts -Force
            Copy-Item scripts/uninstall_driver.ps1 artifacts -Force
            Compress-Archive -Path "artifacts/*" -DestinationPath artifacts/PhoneMic-driver.zip -Force
          } else {
            Write-Host "Драйвер не собран в CI — соберите локально по docs/DRIVER_BUILD.md"
          }

      - name: Upload driver
        uses: actions/upload-artifact@v4
        with:
          name: PhoneMic-windows-driver
          path: artifacts/PhoneMic-driver.zip
          if-no-files-found: ignore
